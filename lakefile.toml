name = "LeanSMILES"
version = "0.1.0"
keywords = ["math", "chemistry", "kinetics"]
defaultTargets = ["LeanSMILES"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.30.0-rc1"


[[lean_lib]]
name = "LeanSMILES"
globs = ["LeanSMILES.*"]

# Tests against RDKit's answers in datasets/ (run from the repository root)
[[lean_exe]]
name = "validity-test"
root = "LeanSMILES.Tests.Validity"

[[lean_exe]]
name = "oracle-test"
root = "LeanSMILES.Tests.Oracle"

[[lean_exe]]
name = "morgan-test"
root = "LeanSMILES.Tests.Morgan"

# Tests for LeanSMILES.Canonical, the RDKit port with full sanitization
[[lean_exe]]
name = "canonical-test"
root = "LeanSMILES.Tests.Canonical"

[[lean_exe]]
name = "phase1-test"
root = "LeanSMILES.Tests.Phase1"

[[lean_exe]]
name = "canonical-validity-test"
root = "LeanSMILES.Tests.CanonicalValidity"

[[lean_exe]]
name = "canonical-morgan-test"
root = "LeanSMILES.Tests.CanonicalMorgan"

# Logistic regression on Morgan fingerprints vs scikit-learn
[[lean_exe]]
name = "logistic-test"
root = "LeanSMILES.Tests.Logistic"
