name = "LeanSMILES"
version = "0.1.0"
keywords = ["math", "chemistry", "kinetics"]
defaultTargets = ["LeanSMILES"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.30.0-rc1"


# Executable core: generic definitions plus their `Float` instantiations. It imports no
# Mathlib and is precompiled to native code, so `#eval` in notebooks and examples runs it at
# compiled speed.
[[lean_lib]]
name = "LeanSMILESExec"
precompileModules = true
roots = []
globs = [
  "LeanSMILES.Primitives.Scalar",
  "LeanSMILES.Primitives.Decimal",
  "LeanSMILES.Primitives.LinAlg",
  "LeanSMILES.Primitives.Parameters",
  "LeanSMILES.MachineLearning.Types",
  "LeanSMILES.MachineLearning.Definitions",
  "LeanSMILES.MachineLearning.Executables",
  "LeanSMILES.SMILES.Types",
  "LeanSMILES.SMILES.Definitions",
  "LeanSMILES.SMILES.Executables",
  "LeanSMILES.API.CSV",
  "LeanSMILES.API.Loader",
  "LeanSMILES.API.Features",
  "LeanSMILES.API.Split",
  "LeanSMILES.API.Metrics",
  "LeanSMILES.API.Stats",
  "LeanSMILES.API.Pipeline",
  "LeanSMILES.MetaPrograms.CacheStore",
]

# Proofs over ℝ (with Mathlib), metaprograms, tests and examples.
[[lean_lib]]
name = "LeanSMILES"
globs = [
  "LeanSMILES.Primitives.Real",
  "LeanSMILES.MachineLearning.Proofs",
  "LeanSMILES.SMILES.Proofs",
  "LeanSMILES.API.Proofs",
  "LeanSMILES.Optimization.+",
  "LeanSMILES.LearningTheory.+",
  "LeanSMILES.MetaPrograms.Test",
  "LeanSMILES.MetaPrograms.Cache",
  "LeanSMILES.Tests.+",
  "LeanSMILES.Examples.+",
]
