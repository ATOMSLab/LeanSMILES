name = "LeanSMILES"
version = "0.1.0"
keywords = ["math", "chemistry", "kinetics"]
defaultTargets = ["LeanSMILES"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.30.0-rc1"


[[lean_lib]]
name = "LeanSMILES"
globs = ["LeanSMILES.*"]

# Tests against RDKit's answers in datasets/ (run from the repository root)
[[lean_exe]]
name = "validity-test"
root = "LeanSMILES.Tests.Validity"

[[lean_exe]]
name = "oracle-test"
root = "LeanSMILES.Tests.Oracle"

[[lean_exe]]
name = "morgan-test"
root = "LeanSMILES.Tests.Morgan"

[[lean_exe]]
name = "charge-test"
root = "LeanSMILES.Tests.Charge"
