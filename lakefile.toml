name = "LeanSMILES"
version = "0.1.0"
keywords = ["math", "chemistry", "kinetics"]
defaultTargets = ["LeanSMILES"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.30.0-rc1"


# Polymorphic definitions and their `Float` instantiation. This library imports no Mathlib
# and is precompiled to native code, so `#eval` runs it at compiled speed.
[[lean_lib]]
name = "LeanSMILESExec"
precompileModules = true
roots = []
globs = [
  "LeanSMILES.Polymorphic.+",
  "LeanSMILES.Float.+",
]

# The `ℝ` instance, the proofs (with Mathlib) and the examples.
[[lean_lib]]
name = "LeanSMILES"
globs = [
  "LeanSMILES",
  "LeanSMILES.Real.+",
  "LeanSMILES.Proofs.+",
  "LeanSMILES.Examples.+",
]
